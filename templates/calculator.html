<!DOCTYPE html>
<html>
<head>
    <title>Beautiful Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            background: #1e1e2f;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0px 12px 35px rgba(0,0,0,0.4);
            width: 320px;
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .inputs {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            outline: none;
        }

        .buttons {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: scale(1.06);
        }

        .op {
            background: #ff9f43;
            color: white;
        }

        .equal {
            background: #00c853;
            color: white;
            grid-column: span 2;
        }

        .clear {
            background: #ff5252;
            color: white;
            grid-column: span 2;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            color: #00e676;
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Calculator</h2>

    <form method="POST">
        <div class="inputs">
            <input type="text" name="num1" placeholder="First number" required>
            <input type="text" name="num2" placeholder="Second number" required>
        </div>

        <div class="buttons">
            <button class="op" name="operation" value="add">+</button>
            <button class="op" name="operation" value="sub">−</button>
            <button class="op" name="operation" value="mul">×</button>
            <button class="op" name="operation" value="div">÷</button>

            <button class="clear" type="reset">Clear</button>
            <button class="equal" type="submit">=</button>
        </div>
    </form>

    {% if result is not none %}
        <div class="result">
            Result: {{ result }}
        </div>
    {% endif %}
</div>

</body>
</html>
